<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密室謎語 - 視覺化微型對話遊戲</title>
    <style>
        /* 全局與重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #app {
            width: 100%;
            max-width: 800px;
            height: 100%;
            max-height: 900px;
            position: relative;
            background: #1e1e1e;
            border: 2px solid #444;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
        }

        /* 共通按鈕樣式 */
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            border-radius: 4px;
            transition: background 0.2s;
        }

        button:hover {
            background: #45a049;
        }

        button.danger {
            background: #f44336;
        }

        button.danger:hover {
            background: #d32f2f;
        }

        button.secondary {
            background: #607D8B;
        }

        button.secondary:hover {
            background: #455A64;
        }

        button.warning {
            background: #795548;
        }

        button.warning:hover {
            background: #5D4037;
        }

        /* 輸入框樣式 */
        input[type="text"],
        textarea,
        select {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 8px;
            font-family: inherit;
            border-radius: 4px;
            width: 100%;
        }

        /* Master Mode (視覺化編輯器 UI) */
        #master-ui {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 20px;
            overflow: hidden;
        }

        .header-bar {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .desc {
            font-size: 14px;
            color: #aaa;
            line-height: 1.4;
        }

        #nodes-container {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 10px;
            margin-bottom: 15px;
            border: 1px solid #333;
            background: #181818;
            padding: 15px;
        }

        /* 節點卡片設計 */
        .node-card {
            background: #252525;
            border-left: 4px solid #4CAF50;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .node-id-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
            margin-right: 20px;
        }

        .node-id-group label {
            font-weight: bold;
            color: #4CAF50;
            white-space: nowrap;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .end-toggle-group {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #333;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        /* 選項區域設計 */
        .options-section {
            background: #1f1f1f;
            padding: 10px;
            border-radius: 4px;
            border: 1px dashed #555;
        }

        .options-section h4 {
            margin-bottom: 10px;
            color: #ff9800;
            font-size: 14px;
        }

        .option-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .option-row input {
            flex-grow: 1;
        }

        .master-actions {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        .btn-row button {
            flex: 1;
            padding: 12px;
        }

        #share-link-container {
            display: none;
            flex-direction: column;
            gap: 5px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #444;
        }

        /* JSON 匯入匯出 Modal */
        #json-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .modal-content {
            background: #222;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            border: 1px solid #555;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.9);
        }

        .modal-content h3 {
            color: #ff9800;
            margin-bottom: 10px;
        }

        #json-io-textarea {
            height: 350px;
            font-family: monospace;
            white-space: pre;
            margin-bottom: 10px;
        }

        /* User Mode (遊戲 UI) */
        #game-ui {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        #scene-display {
            flex-grow: 1;
            background: repeating-linear-gradient(0deg, #111, #111 2px, #1a1a1a 2px, #1a1a1a 4px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        #scene-image-placeholder {
            width: 150px;
            height: 150px;
            border: 2px dashed #555;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            font-size: 40px;
        }

        #dialogue-container {
            height: 250px;
            background: #000;
            border-top: 3px solid #fff;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        #speaker-name {
            color: #ff9800;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        #dialogue-text {
            color: #fff;
            font-size: 16px;
            line-height: 1.5;
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        #options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-btn {
            background: #333;
            text-align: left;
            padding: 10px 15px;
            border: 1px solid #555;
            border-radius: 4px;
        }

        .option-btn:hover {
            background: #555;
            border-color: #fff;
        }

        #end-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #end-message {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            padding: 20px;
        }

        .win-text {
            color: #4CAF50;
        }

        .lose-text {
            color: #f44336;
        }
    </style>
</head>

<body>

    <div id="app">
        <!-- Master Mode: 視覺化編輯器 -->
        <div id="master-ui">
            <div class="header-bar">
                <h1>🛠️ 視覺化劇本編輯器</h1>
                <div class="desc">直接填寫表單即可設計劇情。請確保必須有一個 ID 為「start」的節點。<br>進階玩家可使用「匯入/匯出 JSON」備份劇本。</div>
            </div>

            <div id="nodes-container">
                <!-- 節點卡片會動態插入在這裡 -->
            </div>

            <div class="master-actions">
                <div class="btn-row">
                    <button id="btn-add-node" class="secondary">+ 新增劇情節點</button>
                    <button id="btn-json-io" class="warning">📦 匯入 / 匯出 JSON</button>
                </div>
                <button id="btn-generate" style="padding: 12px; font-size: 18px;">✨ 生成分享連結 ✨</button>

                <div id="share-link-container">
                    <div class="desc">你的專屬遊戲網址（已自動複製，可直接貼上分享）：</div>
                    <input type="text" id="share-link" readonly onclick="this.select()">
                    <button id="btn-test-play" style="background:#2196F3;">▶ 立即試玩</button>
                </div>
            </div>
        </div>

        <!-- JSON 匯入/匯出 Modal -->
        <div id="json-modal">
            <div class="modal-content">
                <h3>📦 JSON 劇本原始碼</h3>
                <div class="desc" style="margin-bottom:10px;">你可以在此備份目前的劇本，或是將別人分享的 JSON 貼上來套用。</div>
                <textarea id="json-io-textarea"></textarea>
                <div class="btn-row">
                    <button id="btn-json-apply">💾 套用變更</button>
                    <button id="btn-json-close" class="danger">取消</button>
                </div>
            </div>
        </div>

        <!-- User Mode: 遊戲迴圈與對話介面 -->
        <div id="game-ui">
            <div id="scene-display">
                <div id="scene-image-placeholder">?</div>
            </div>
            <div id="dialogue-container">
                <div id="speaker-name">Speaker</div>
                <div id="dialogue-text">Dialogue text goes here...</div>
                <div id="options-container"></div>
            </div>

            <div id="end-screen">
                <div id="end-message"></div>
                <button id="btn-restart" style="width: 200px;">重新開始</button>
                <button id="btn-to-editor" style="width: 200px; margin-top: 10px; background: #607D8B;">回編輯器修改</button>
            </div>
        </div>
    </div>

    <script>
        /** 預設劇本資料 */
        const defaultScript = {
            "start": {
                "speaker": "神秘聲音",
                "text": "你醒來了。頭很痛，眼前是一扇厚重的鐵門。你要做什麼？",
                "options": [
                    { "text": "檢查桌子", "next": "table" },
                    { "text": "嘗試開門", "next": "door" }
                ]
            },
            "table": {
                "speaker": "系統",
                "text": "桌上有張紙條，寫著：「密碼是 0000」。",
                "options": [
                    { "text": "回去", "next": "start" }
                ]
            },
            "door": {
                "speaker": "密碼鎖",
                "text": "請輸入密碼：",
                "options": [
                    { "text": "輸入 1234", "next": "bad_end" },
                    { "text": "輸入 0000", "next": "good_end" }
                ]
            },
            "bad_end": { "speaker": "系統", "text": "密碼錯誤！毒氣釋放...", "isEnd": true, "win": false },
            "good_end": { "speaker": "系統", "text": "密碼正確！你逃出了密室。", "isEnd": true, "win": true }
        };

        // DOM Elements
        const app = document.getElementById('app');
        const masterUI = document.getElementById('master-ui');
        const gameUI = document.getElementById('game-ui');
        const nodesContainer = document.getElementById('nodes-container');

        // Master Actions
        const btnAddNode = document.getElementById('btn-add-node');
        const btnGenerate = document.getElementById('btn-generate');
        const shareLinkContainer = document.getElementById('share-link-container');
        const shareLinkInput = document.getElementById('share-link');
        const btnTestPlay = document.getElementById('btn-test-play');

        // JSON Modal
        const btnJsonIo = document.getElementById('btn-json-io');
        const jsonModal = document.getElementById('json-modal');
        const jsonTextarea = document.getElementById('json-io-textarea');
        const btnJsonApply = document.getElementById('btn-json-apply');
        const btnJsonClose = document.getElementById('btn-json-close');

        // Game UI Elements
        const speakerName = document.getElementById('speaker-name');
        const dialogueText = document.getElementById('dialogue-text');
        const optionsContainer = document.getElementById('options-container');
        const endScreen = document.getElementById('end-screen');
        const endMessage = document.getElementById('end-message');

        let currentScript = {};
        let currentNodeId = 'start';

        // 安全的 Base64 編解碼
        function utf8ToBase64(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function (match, p1) { return String.fromCharCode('0x' + p1); }));
        }
        function base64ToUtf8(str) {
            return decodeURIComponent(Array.prototype.map.call(atob(str), function (c) { return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2); }).join(''));
        }

        /* =========================================
           Master Mode: 視覺化編輯器核心邏輯
        ========================================= */

        function createOptionElement(optText = '', optNext = '') {
            const row = document.createElement('div');
            row.className = 'option-row';
            row.innerHTML = `
        <input type="text" class="opt-text" placeholder="選項文字 (例: 檢查桌子)" value="${optText}">
        <span>👉 前往節點</span>
        <input type="text" class="opt-next" placeholder="目標ID (例: table)" value="${optNext}" style="width: 120px;">
        <button class="danger btn-del-opt">X</button>
    `;
            row.querySelector('.btn-del-opt').onclick = () => row.remove();
            return row;
        }

        function createNodeCard(id, data = {}) {
            const card = document.createElement('div');
            card.className = 'node-card';

            const isEnd = data.isEnd || false;
            const winStr = data.win ? 'true' : 'false';

            card.innerHTML = `
        <div class="node-header">
            <div class="node-id-group">
                <label>節點 ID:</label>
                <input type="text" class="node-id" value="${id}" placeholder="英文或數字 (必須要有 start)">
            </div>
            <button class="danger btn-del-node">刪除此節點</button>
        </div>
        <div class="form-group">
            <input type="text" class="node-speaker" value="${data.speaker || ''}" placeholder="說話者名稱 (例: 神秘聲音)">
        </div>
        <div class="form-group">
            <textarea class="node-text" placeholder="對話內容...">${data.text || ''}</textarea>
        </div>
        <div class="end-toggle-group">
            <label><input type="checkbox" class="node-isEnd" ${isEnd ? 'checked' : ''}> 這是結局節點</label>
            <select class="node-win" style="display: ${isEnd ? 'block' : 'none'}; width: 150px;">
                <option value="true" ${winStr === 'true' ? 'selected' : ''}>通關 (Win)</option>
                <option value="false" ${winStr === 'false' ? 'selected' : ''}>失敗 (Lose)</option>
            </select>
        </div>
        <div class="options-section" style="display: ${isEnd ? 'none' : 'block'};">
            <h4>分支選項：</h4>
            <div class="options-list"></div>
            <button class="secondary btn-add-opt" style="margin-top: 10px;">+ 新增選項</button>
        </div>
    `;

            const chkEnd = card.querySelector('.node-isEnd');
            const selWin = card.querySelector('.node-win');
            const optSection = card.querySelector('.options-section');
            chkEnd.addEventListener('change', (e) => {
                const checked = e.target.checked;
                selWin.style.display = checked ? 'block' : 'none';
                optSection.style.display = checked ? 'none' : 'block';
            });

            card.querySelector('.btn-del-node').onclick = () => {
                if (confirm('確定要刪除這個節點嗎？')) card.remove();
            };

            const optsList = card.querySelector('.options-list');
            if (data.options && data.options.length > 0) {
                data.options.forEach(opt => optsList.appendChild(createOptionElement(opt.text, opt.next)));
            } else if (!isEnd) {
                optsList.appendChild(createOptionElement());
            }

            card.querySelector('.btn-add-opt').onclick = () => optsList.appendChild(createOptionElement());

            return card;
        }

        // 提取資料 (strict 模式用於生成網址時，會嚴格檢查 start 節點)
        function extractEditorData(strict = true) {
            const scriptObj = {};
            let hasStart = false;

            document.querySelectorAll('.node-card').forEach(card => {
                const id = card.querySelector('.node-id').value.trim();
                if (!id) return;
                if (id === 'start') hasStart = true;

                const nodeData = {
                    speaker: card.querySelector('.node-speaker').value.trim(),
                    text: card.querySelector('.node-text').value.trim(),
                    isEnd: card.querySelector('.node-isEnd').checked
                };

                if (nodeData.isEnd) {
                    nodeData.win = card.querySelector('.node-win').value === 'true';
                } else {
                    const options = [];
                    card.querySelectorAll('.option-row').forEach(row => {
                        const optText = row.querySelector('.opt-text').value.trim();
                        const optNext = row.querySelector('.opt-next').value.trim();
                        if (optText || optNext) {
                            options.push({ text: optText, next: optNext });
                        }
                    });
                    nodeData.options = options;
                }
                scriptObj[id] = nodeData;
            });

            if (strict && !hasStart) throw new Error("必須要有一個節點的 ID 命名為 'start' 遊戲才能開始！");
            return scriptObj;
        }

        function loadEditor(scriptObj) {
            nodesContainer.innerHTML = '';
            for (const [id, data] of Object.entries(scriptObj)) {
                nodesContainer.appendChild(createNodeCard(id, data));
            }
        }

        btnAddNode.addEventListener('click', () => {
            nodesContainer.appendChild(createNodeCard('new_node_' + Math.floor(Math.random() * 1000)));
            nodesContainer.scrollTop = nodesContainer.scrollHeight;
        });

        // JSON 匯入/匯出互動邏輯
        btnJsonIo.addEventListener('click', () => {
            const jsonObj = extractEditorData(false); // 關閉嚴格檢查，允許不完整的劇本匯出
            jsonTextarea.value = JSON.stringify(jsonObj, null, 4);
            jsonModal.style.display = 'flex';
        });

        btnJsonClose.addEventListener('click', () => {
            jsonModal.style.display = 'none';
        });

        btnJsonApply.addEventListener('click', () => {
            try {
                const parsedData = JSON.parse(jsonTextarea.value);
                loadEditor(parsedData);
                jsonModal.style.display = 'none';
            } catch (e) {
                alert("JSON 格式有誤，無法套用：\n" + e.message);
            }
        });

        // 生成分享網址
        btnGenerate.addEventListener('click', () => {
            try {
                const jsonObj = extractEditorData(true); // 嚴格檢查，確保可遊玩
                const jsonStr = JSON.stringify(jsonObj);
                const encodedData = encodeURIComponent(utf8ToBase64(jsonStr));
                const baseUrl = window.location.href.split('?')[0];
                const shareUrl = baseUrl + '?script=' + encodedData;

                shareLinkInput.value = shareUrl;
                shareLinkContainer.style.display = 'flex';

                shareLinkInput.select();
                document.execCommand('copy');
                btnGenerate.innerText = "✅ 連結已生成並複製！";
                setTimeout(() => btnGenerate.innerText = "✨ 生成分享連結 ✨", 2000);

            } catch (e) {
                alert("生成失敗：\n" + e.message);
            }
        });

        btnTestPlay.addEventListener('click', () => {
            window.location.href = shareLinkInput.value;
        });

        /* =========================================
           User Mode: 遊戲迴圈邏輯
        ========================================= */

        function init() {
            app.style.display = 'flex';
            const urlParams = new URLSearchParams(window.location.search);
            const scriptRaw = urlParams.get('script');

            if (scriptRaw) {
                masterUI.style.display = 'none';
                gameUI.style.display = 'flex';
                try {
                    const safeBase64 = scriptRaw.replace(/ /g, '+');
                    currentScript = JSON.parse(base64ToUtf8(safeBase64));
                    startGame();
                } catch (e) {
                    alert("劇本解析失敗！網址可能損壞。\n" + e.message);
                    window.location.href = window.location.href.split('?')[0];
                }
            } else {
                masterUI.style.display = 'flex';
                gameUI.style.display = 'none';
                loadEditor(defaultScript);
            }
        }

        function startGame() {
            currentNodeId = 'start';
            endScreen.style.display = 'none';
            renderNode();
        }

        function renderNode() {
            const node = currentScript[currentNodeId];
            if (!node) {
                alert(`錯誤：劇本走到死胡同，找不到名為 [${currentNodeId}] 的節點！`);
                return;
            }

            speakerName.innerText = node.speaker || "未知";
            dialogueText.innerText = node.text || "...";
            optionsContainer.innerHTML = "";

            if (node.isEnd) {
                endScreen.style.display = 'flex';
                endMessage.innerText = node.win ? "✨ 遊戲通關 ✨\n" + node.text : "💀 遊戲結束 💀\n" + node.text;
                endMessage.className = node.win ? "win-text" : "lose-text";
                return;
            }

            if (node.options && node.options.length > 0) {
                node.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = "▶ " + opt.text;
                    btn.onclick = () => handleChoice(opt.next);
                    optionsContainer.appendChild(btn);
                });
            } else {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = "▶ (劇本未定義後續，點擊重新開始)";
                btn.onclick = startGame;
                optionsContainer.appendChild(btn);
            }
        }

        function handleChoice(nextNodeId) {
            currentNodeId = nextNodeId;
            renderNode();
        }

        document.getElementById('btn-restart').addEventListener('click', startGame);
        document.getElementById('btn-to-editor').addEventListener('click', () => {
            window.location.href = window.location.href.split('?')[0];
        });

        init();
    </script>
</body>

</html>
